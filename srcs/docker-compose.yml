networks:
    jaacostanet:
        name: jaacostanet
        driver: bridge

services:
    nginx:
        container_name: nginx
        build: ./requirements/nginx
        image: inception_nginx:1.0
        ports:
         - 443:443
        volumes:
         - wordpress_data:/var/www/html
        restart: always
        networks:
         - jaacostanet

    mariadb:
        container_name: mariadb
        build:
          context: ./requirements/mariadb
        image: inception_mariadb:1.0
        volumes:
         - mariadb_data:/var/lib/mysql
        restart: always
        networks:
         - jaacostanet
        env_file:
         - .env

    wordpress:
        container_name: wordpress
        build: ./requirements/wordpress
        image: inception_wordpress:1.0
        depends_on:
         - mariadb
        volumes:
         - wordpress_data:/var/www/html
        restart: always
        networks:
         - jaacostanet
        env_file:
         - .env

volumes:
    mariadb_data:
        driver: local
        driver_opts:
            type: none
            device: /home/jaacosta/data/mariadb
            o: bind

    wordpress_data:
        driver: local
        driver_opts:
            type: none
            device: /home/jaacosta/data/wordpress
            o: bind
